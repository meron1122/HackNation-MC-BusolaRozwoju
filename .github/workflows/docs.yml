# Składa Markdown z docs/ do PDF (docs/build.py) i publikuje je jako artefakt busola-docs.
# GitHub pakuje artefakt w ZIP przy pobieraniu, więc do pobrania jest busola-docs.zip z PDF-ami.
# Na main dodatkowo kopiuje docs/ do wiki repozytorium (job wiki).
name: Dokumentacja PDF

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/frontend/public/logo/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'src/frontend/public/logo/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Pango dla WeasyPrint, Inter jako font aplikacji (bez niego PDF dostaje font zastępczy).
      - name: Biblioteki systemowe i font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-inter

      - name: Zależności
        run: pip install -r docs/requirements.txt

      - name: Budowanie PDF
        run: python docs/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: busola-docs
          path: docs/pdf/*.pdf
          if-no-files-found: error

  # Wiki repozytorium = kopia docs/ z main (bez README, które jest dla programistów). Strona główna to
  # docs/wiki/Home.md z listą stron w miejscu {{STRONY}}: tytuł „# …” i akapit wstępny każdego dokumentu.
  # Wiki zawsze odzwierciedla main, więc ręczne edycje w wiki zostaną nadpisane.
  wiki:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publikacja w wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          git -C wiki rm -rq --ignore-unmatch .
          cp -r docs/img wiki/img
          pages="${RUNNER_TEMP:-/tmp}/strony.md"
          : > "$pages"
          echo "- [Strona główna](Home)" > wiki/_Sidebar.md
          for f in docs/*.md; do
            [ "$(basename "$f")" = README.md ] && continue
            title=$(grep -m1 '^# ' "$f" | sed 's/^# //')
            page=$(echo "$title" | tr ' /' '--')
            lead=$(awk '/^# /{f=1; next} f && NF {print; exit}' "$f")
            cp "$f" "wiki/$page.md"
            echo "- [$title]($page)" >> wiki/_Sidebar.md
            printf '### [%s](%s)\n\n%s\n\n' "$title" "$page" "$lead" >> "$pages"
          done
          sed -e "/{{STRONY}}/{r $pages" -e 'd}' docs/wiki/Home.md > wiki/Home.md
          cd wiki
          git add -A
          if git diff --cached --quiet; then echo "Wiki bez zmian"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Dokumentacja z ${GITHUB_SHA::7}"
          git push -q
