<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">Jak powstaje odpowiedź asystenta</title>
  <desc id="d">Pięć kroków: pytanie, kontekst z ekranu i przepisów w zakresie uprawnień, model AI, kontrola odpowiedzi, odpowiedź ze źródłem.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5d6680"/>
    </marker>
  </defs>
  <rect width="760" height="230" rx="16" fill="#ffffff"/>
  <g font-size="11" fill="#5d6680" text-anchor="middle" font-weight="600">
    <circle cx="84" cy="36" r="11" fill="#dceefb"/><text x="84" y="40" fill="#1f2a5a">1</text>
    <circle cx="234" cy="36" r="11" fill="#dceefb"/><text x="234" y="40" fill="#1f2a5a">2</text>
    <circle cx="384" cy="36" r="11" fill="#dceefb"/><text x="384" y="40" fill="#1f2a5a">3</text>
    <circle cx="534" cy="36" r="11" fill="#dceefb"/><text x="534" y="40" fill="#1f2a5a">4</text>
    <circle cx="684" cy="36" r="11" fill="#dceefb"/><text x="684" y="40" fill="#1f2a5a">5</text>
  </g>
  <g stroke="#e4e7ef">
    <rect x="20" y="60" width="128" height="96" rx="12" fill="#ffffff"/>
    <rect x="170" y="60" width="128" height="96" rx="12" fill="#dceefb" stroke="#dceefb"/>
    <rect x="320" y="60" width="128" height="96" rx="12" fill="#1f2a5a" stroke="#1f2a5a"/>
    <rect x="470" y="60" width="128" height="96" rx="12" fill="#e7e2fa" stroke="#e7e2fa"/>
    <rect x="620" y="60" width="128" height="96" rx="12" fill="#ffffff" stroke="#1f2a5a" stroke-width="1.5"/>
  </g>
  <g stroke="#5d6680" stroke-width="1.5" marker-end="url(#a)">
    <line x1="150" y1="108" x2="167" y2="108"/>
    <line x1="300" y1="108" x2="317" y2="108"/>
    <line x1="450" y1="108" x2="467" y2="108"/>
    <line x1="600" y1="108" x2="617" y2="108"/>
  </g>
  <g text-anchor="middle" fill="#1f2a5a">
    <g font-size="14" font-weight="700">
      <text x="84" y="96">Pytanie</text>
      <text x="234" y="96">Kontekst</text>
      <text x="384" y="96" fill="#ffffff">Model AI</text>
      <text x="534" y="96">Kontrola</text>
      <text x="684" y="96">Odpowiedź</text>
    </g>
    <g font-size="10.5">
      <text x="84" y="118">z dowolnego ekranu</text>
      <text x="84" y="133">albo z podpowiedzi</text>
      <text x="234" y="118">ekran + przepisy</text>
      <text x="234" y="133">w zakresie uprawnień</text>
      <text x="384" y="118" fill="#ffffff">odpowiada tylko</text>
      <text x="384" y="133" fill="#ffffff">z materiału</text>
      <text x="534" y="118">przypisy § i art.,</text>
      <text x="534" y="133">próby manipulacji</text>
      <text x="684" y="118">ze źródłem,</text>
      <text x="684" y="133">decyzja: przełożony</text>
    </g>
  </g>
  <text x="380" y="198" text-anchor="middle" font-size="11.5" fill="#5d6680">Każda odpowiedź przechodzi tę samą ścieżkę na serwerze, niezależnie od tego, co wpisze użytkownik.</text>
</svg>
