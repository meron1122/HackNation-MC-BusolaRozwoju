<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">Architektura Busoli Rozwoju</title>
  <desc id="d">Przeglądarka z aplikacją React łączy się przez HTTPS z jednym kontenerem Docker z API .NET 10. API zapisuje dane w PostgreSQL, a asystent AI korzysta z modelu językowego i embeddingów przez OpenRouter.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5d6680"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="16" fill="#ffffff"/>

  <!-- Przeglądarka -->
  <rect x="20" y="110" width="138" height="90" rx="12" fill="#dceefb"/>
  <g text-anchor="middle" fill="#1f2a5a">
    <text x="89" y="143" font-size="14" font-weight="700">Przeglądarka</text>
    <text x="89" y="163" font-size="10.5">React 19 + TypeScript</text>
    <text x="89" y="178" font-size="10.5">WCAG 2.1 AA</text>
  </g>

  <!-- Kontener -->
  <rect x="200" y="22" width="360" height="286" rx="14" fill="#fbf9f6" stroke="#858ca3" stroke-dasharray="5 4"/>
  <text x="380" y="44" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d6680" letter-spacing="0.06em">JEDEN KONTENER DOCKER</text>
  <rect x="220" y="56" width="320" height="38" rx="10" fill="#1f2a5a"/>
  <text x="380" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">API .NET 10 (ASP.NET Core)</text>
  <g stroke="#e4e7ef" fill="#ffffff">
    <rect x="220" y="108" width="152" height="44" rx="10"/>
    <rect x="388" y="108" width="152" height="44" rx="10"/>
    <rect x="220" y="164" width="152" height="44" rx="10"/>
    <rect x="388" y="164" width="152" height="44" rx="10"/>
    <rect x="220" y="220" width="152" height="44" rx="10"/>
    <rect x="388" y="220" width="152" height="44" rx="10" fill="#e7e2fa" stroke="#e7e2fa"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2a5a">
    <text x="296" y="134">Oceny i terminy</text>
    <text x="464" y="134">Uprawnienia i zakresy</text>
    <text x="296" y="190">Arkusze PDF (PDF/UA)</text>
    <text x="464" y="190">Podpisy przez link i QR</text>
    <text x="296" y="246">Przypomnienia</text>
    <text x="464" y="246">Asystent AI (RAG)</text>
  </g>
  <text x="380" y="290" text-anchor="middle" font-size="10.5" fill="#5d6680">API serwuje też frontend: jeden adres, jedno wdrożenie</text>

  <!-- PostgreSQL -->
  <rect x="590" y="66" width="150" height="86" rx="12" fill="#ffffff" stroke="#1f2a5a" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1f2a5a">
    <text x="665" y="99" font-size="14" font-weight="700">PostgreSQL 17</text>
    <text x="665" y="119" font-size="10.5">dane, szablony arkuszy,</text>
    <text x="665" y="134" font-size="10.5">wektory przepisów</text>
  </g>

  <!-- OpenRouter -->
  <rect x="590" y="196" width="150" height="86" rx="12" fill="#ffffff" stroke="#8e7ce0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g text-anchor="middle" fill="#1f2a5a">
    <text x="665" y="229" font-size="14" font-weight="700">OpenRouter</text>
    <text x="665" y="249" font-size="10.5">model językowy</text>
    <text x="665" y="264" font-size="10.5">i embeddingi, wymienne</text>
  </g>

  <!-- Połączenia -->
  <g stroke="#5d6680" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="155" x2="198" y2="155"/>
    <line x1="562" y1="109" x2="588" y2="109"/>
    <line x1="542" y1="242" x2="588" y2="239"/>
  </g>
  <g font-size="9.5" fill="#5d6680" text-anchor="middle">
    <text x="179" y="146">HTTPS</text>
  </g>
</svg>
